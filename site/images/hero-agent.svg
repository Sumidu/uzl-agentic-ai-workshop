<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Window -->
  <rect width="560" height="440" rx="18" fill="#ffffff"/>
  <path d="M0 18A18 18 0 0 1 18 0H542A18 18 0 0 1 560 18V44H0Z" fill="#f4f6fa"/>
  <line x1="0" y1="44.5" x2="560" y2="44.5" stroke="#dfe5ee"/>
  <circle cx="24" cy="22" r="6" fill="#dfe5ee"/>
  <circle cx="44" cy="22" r="6" fill="#dfe5ee"/>
  <circle cx="64" cy="22" r="6" fill="#dfe5ee"/>
  <text x="280" y="27" font-size="14" fill="#5d6876" text-anchor="middle">literatur.bib</text>

  <!-- Request -->
  <rect x="150" y="62" width="386" height="64" rx="14" fill="#3558c8"/>
  <text x="170" y="89" font-size="15" fill="#ffffff">Prüfe mein Literaturverzeichnis nach APA 7</text>
  <text x="170" y="111" font-size="15" fill="#ffffff">und ergänze fehlende DOIs.</text>

  <!-- Agent -->
  <circle cx="36" cy="154" r="12" fill="#eef2ff" stroke="#3558c8" stroke-width="1.5"/>
  <path d="M36 146Q37 153 44 154Q37 155 36 162Q35 155 28 154Q35 153 36 146Z" fill="#3558c8"/>
  <text x="56" y="159" font-size="14" font-weight="700" fill="#1d2a4a">KI-Agent</text>

  <!-- Steps -->
  <circle cx="36" cy="186" r="10" fill="#176b50"/>
  <path d="M31 186l3.5 3.5L41 183" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="56" y="191" font-size="15" fill="#18202a">48 Einträge gelesen</text>

  <circle cx="36" cy="218" r="10" fill="#176b50"/>
  <path d="M31 218l3.5 3.5L41 215" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="56" y="223" font-size="15" fill="#18202a">41 Einträge entsprechen APA 7</text>

  <circle cx="36" cy="250" r="10" fill="#b26b00"/>
  <rect x="34.8" y="243" width="2.4" height="8" rx="1.2" fill="#ffffff"/>
  <circle cx="36" cy="255" r="1.4" fill="#ffffff"/>
  <text x="56" y="255" font-size="15" font-weight="600" fill="#18202a">7 DOIs ergänzt – bitte prüfen</text>

  <!-- Review -->
  <rect x="24.5" y="276.5" width="511" height="143" rx="12" fill="#f8f9fc" stroke="#dfe5ee"/>
  <text x="40" y="301" font-size="13" fill="#5d6876">Änderung 1 von 7 zur Freigabe</text>
  <rect x="40" y="312" width="480" height="28" rx="6" fill="#fdecea"/>
  <text x="52" y="331" font-size="14" fill="#9b1c1c">−  Muster, A. (2021). Beispielstudie. Fachjournal.</text>
  <rect x="40" y="344" width="480" height="28" rx="6" fill="#e6f4ee"/>
  <text x="52" y="363" font-size="14" fill="#145c44">+  … Fachjournal, 12(3), 45–67. doi:10.xxxx/abc</text>
  <rect x="40" y="382" width="116" height="28" rx="8" fill="#3558c8"/>
  <text x="98" y="401" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Übernehmen</text>
  <rect x="164.5" y="382.5" width="99" height="27" rx="8" fill="#ffffff" stroke="#c9d2e3"/>
  <text x="214" y="401" font-size="13" font-weight="700" fill="#1d2a4a" text-anchor="middle">Ablehnen</text>
</svg>
